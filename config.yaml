# Paths are relative to the repo root, so this works on any machine
data:
  ground_truth_csv: data/ground_truth.csv
  pdf_dir: data/pdfs
  id_column: paperID
  name_column: "name of molecule"
  smiles_column: canonical_SMILES

biominer:
  repo_dir: ../BioMiner-main
  molglyph_weights: ../BioMiner-main/molglyph_large.pt
  moldet_weights: ../BioMiner-main/moldet_v2_yolo11n_960_doc.pt
  device: cpu            # Colab runs override this with --device cuda

output:
  results_dir: results

  # Tables to assemble. Each entry records settings verified in development:
# slot mappings and linker direction were each confirmed with a self test or by name.
tables:
  drawn:            # scaffold + drawn R-group cells (src/assemble.py)
    - {paper: "2", page: 5}
  text:             # R-groups written as text (src/text_tables.py)
    - {paper: "19", page: 4, scaffold_crop: 19_p4_003, id_pattern: '^[1-6]$', columns: ["ring:1", "ring:2", "3"]}
    - {paper: "19", page: 5, scaffold_crop: 19_p5_001, id_pattern: '^(1|10[a-i])$', linker: reverse}
    - {paper: "19", page: 6, scaffold_crop: 19_p6_001, id_pattern: '^(1|12[a-z])$'}
    - {paper: "19", page: 8, scaffold_crop: 19_p8_001, id_pattern: '^(VMF|20[a-g]|2[1-5])$', columns: [ring, "3", "2", "4", "5"]}
  pieces_warhead:   # warheads + small group or big piece (src/pieces.py)
    - {paper: "4", page: 6, piece_crop: 4_p6_001, name_pattern: '^(5[2-6]|4[4-9]|CCT400028)$'}
  pieces_linker:    # warhead + two-ended linker + ligand piece (src/pieces.py)
    - {paper: "4", page: 4, warhead_crop: 4_p6_004, ligand_piece_crop: 4_p6_001, name_pattern: '^(JB\d+|4[2-6]|51)$'}
  image:            # image tables read by targeted OCR (src/read_columns.py on Colab, then src/image_tables.py)
    - {paper: "19", page: 7, scaffolds: {A: 19_p7_002, B: 19_p7_001}, ring_slot: 1, r_slot: 2}
  grid:             # tables read by grid detection + grid OCR (src/table_grid.py, src/grid_ocr.py on Colab, src/grid_tables.py)
    - {paper: "19", page: 9, scaffold_crop: 19_p8_001}
  scheme:           # scheme placeholders resolved by the scheme's own definition box (src/scheme_placeholders.py)
    - {paper: "4", page: 3, box_crops: [4_p3_040, 4_p3_041, 4_p3_039, 4_p3_031], letters: ABCD, blue_letter: C}